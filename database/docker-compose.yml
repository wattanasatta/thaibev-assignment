# SQL Server for LOCAL DEVELOPMENT ONLY.
# The SA password is never stored in this file. Provide it via environment
# variable MSSQL_SA_PASSWORD (e.g. copy .env.example to .env and edit it).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required - copy .env.example to .env and set a strong password}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  sqlserver-data:
